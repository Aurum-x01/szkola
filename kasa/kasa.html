<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Program kasjera</title>
  <style>
    :root{--bg:#f6f7fb;--card:#ffffff;--accent:#2563eb;--accent-2:#7c3aed}
    *{box-sizing:border-box;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{margin:0;background:linear-gradient(180deg,var(--bg),#fff);padding:28px;color:#111}
    .wrap{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 420px;gap:20px}
    .card{background:var(--card);border-radius:12px;box-shadow:0 6px 20px rgba(20,20,50,0.06);padding:18px}
    h1{margin:0 0 8px;font-size:20px}
    .products{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .prod{padding:10px;border-radius:8px;border:1px solid #eef2ff;display:flex;justify-content:space-between;align-items:center}
    .prod .meta{display:flex;flex-direction:column}
    .prod strong{font-size:15px}
    .prod small{color:#555}
    .btn{background:var(--accent);color:#fff;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
    .btn:active{transform:translateY(1px)}
    .controls{display:flex;gap:8px;margin-top:10px}
    .search{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd}

    /* koszyk */
    .cart-list{max-height:300px;overflow:auto;margin-top:8px}
    .item{display:flex;align-items:center;justify-content:space-between;padding:8px;border-bottom:1px dashed #eee}
    .qty{display:flex;gap:6px;align-items:center}
    .qty button{padding:4px 8px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer}
    .summary{margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0}
    .summary div{display:flex;justify-content:space-between;padding:6px 0}
    .total{font-weight:700;font-size:18px}

    /* płatność */
    .payment{margin-top:12px;display:flex;flex-direction:column;gap:6px}
    .payment input{padding:6px;border-radius:6px;border:1px solid #ddd;width:120px}
    .change{font-weight:600;margin-top:6px}

    /* rachunek */
    .receipt{white-space:pre-wrap;font-family:monospace;background:#fafafa;padding:12px;border-radius:8px;margin-top:10px}

    footer{grid-column:1/-1;margin-top:12px;text-align:center;color:#666;font-size:13px}

    @media (max-width:920px){.wrap{grid-template-columns:1fr;}.products{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Program kasjera</h1>
      <div>Wybierz produkty, dodaj ilość i wydrukuj paragon.</div>

      <div class="controls">
        <input id="search" class="search" placeholder="Szukaj produktu..." />
        <button id="clearSearch" class="btn" style="background:#6b7280">Wyczyść</button>
      </div>

      <div id="products" class="products" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h1>Koszyk</h1>
      <div id="cart" class="cart-list"></div>

      <div class="summary">
        <div><span>Suma netto:</span><span id="sumNet">0.00 zł</span></div>
        <div><span>VAT (23%):</span><span id="vat">0.00 zł</span></div>
        <div class="total"><span>Razem do zapłaty:</span><span id="sumGross">0.00 zł</span></div>

        <div class="payment">
          <div style="display:flex;gap:8px;align-items:center">
            <label for="cash">Gotówka od klienta: </label>
            <input id="cash" type="number" min="0" step="0.01" placeholder="0.00 zł">
            <button id="calculateChange" class="btn">Oblicz resztę</button>
          </div>
          <div class="change" id="changeDisplay">Reszta: 0.00 zł</div>
        </div>

        <div style="display:flex;gap:8px;margin-top:10px">
          <button id="print" class="btn">Drukuj paragon</button>
          <button id="clear" class="btn" style="background:#ef4444">Wyczyść koszyk</button>
        </div>

        <div class="receipt" id="receipt" style="display:none"></div>
      </div>
    </div>

    <footer>Prosty program kasjera — interfejs po polsku</footer>
  </div>

    const VAT_RATE = 0.23;

    const productsEl = document.getElementById('products');
    const cartEl = document.getElementById('cart');
    const sumNetEl = document.getElementById('sumNet');
    const vatEl = document.getElementById('vat');
    const sumGrossEl = document.getElementById('sumGross');
    const receiptEl = document.getElementById('receipt');
    const cashEl = document.getElementById('cash');
    const changeEl = document.getElementById('changeDisplay');

    let cart = {};

    function formatPrice(n){return n.toFixed(2) + ' zł'}

    function renderProducts(filter = ''){
      productsEl.innerHTML = '';
      const f = filter.trim().toLowerCase();
      PRODUCTS.filter(p => p.name.toLowerCase().includes(f) || p.id.includes(f))
        .forEach(p => {
          const d = document.createElement('div'); d.className='prod';
          d.innerHTML = `<div class="meta"><strong>${p.name}</strong><small>${formatPrice(p.price)}</small></div>`;
          const btn = document.createElement('button'); btn.className='btn'; btn.textContent='Dodaj';
          btn.onclick = () => addToCart(p.id);
          d.appendChild(btn);
          productsEl.appendChild(d);
        });
    }

    function addToCart(id){
      const prod = PRODUCTS.find(p=>p.id===id); if(!prod) return;
      if(!cart[id]) cart[id] = {product: prod, qty:0};
      cart[id].qty += 1;
      renderCart();
    }

    function changeQty(id, delta){
      if(!cart[id]) return;
      cart[id].qty += delta;
      if(cart[id].qty <= 0) delete cart[id];
      renderCart();
    }

    function removeItem(id){ delete cart[id]; renderCart(); }

    function renderCart(){
      cartEl.innerHTML = '';
      let sumNet = 0;
      Object.values(cart).forEach(({product, qty})=>{
        const lineNet = product.price * qty;
        sumNet += lineNet;
        const it = document.createElement('div'); it.className='item';
        it.innerHTML = `
          <div>
            <div style="font-weight:600">${product.name}</div>
            <div style="font-size:13px;color:#666">${formatPrice(product.price)} x ${qty} = ${formatPrice(lineNet)}</div>
          </div>
        `;
        const controls = document.createElement('div'); controls.className='qty';
        const minus = document.createElement('button'); minus.textContent='−'; minus.onclick = ()=>changeQty(product.id, -1);
        const plus = document.createElement('button'); plus.textContent='+'; plus.onclick = ()=>changeQty(product.id, +1);
        const del = document.createElement('button'); del.textContent='Usuń'; del.onclick = ()=>removeItem(product.id);
        controls.appendChild(minus); controls.appendChild(plus); controls.appendChild(del);
        it.appendChild(controls);
        cartEl.appendChild(it);
      });

      const vat = sumNet * VAT_RATE;
      const gross = sumNet + vat;
      sumNetEl.textContent = formatPrice(sumNet);
      vatEl.textContent = formatPrice(vat);
      sumGrossEl.textContent = formatPrice(gross);

      changeEl.textContent = 'Reszta: 0.00 zł';

      if(Object.keys(cart).length === 0){ receiptEl.style.display='none'; receiptEl.textContent=''; }
      else{
        receiptEl.style.display='block';
        let now = new Date();
        let header = `PARAGON FISKALNY\nData: ${now.toLocaleString('pl-PL')}\n-------------------------------\n`;
        let body = '';
        Object.values(cart).forEach(({product, qty})=>{
          const lineNet = product.price * qty;
          body += `${product.name} x${qty}    ${lineNet.toFixed(2)} zł\n`;
        });
        body += `-------------------------------\nSuma netto: ${sumNet.toFixed(2)} zł\nVAT (23%): ${vat.toFixed(2)} zł\nRAZEM: ${gross.toFixed(2)} zł\n`;
        receiptEl.textContent = header + body + '\nDziękujemy za zakupy!';
      }
    }

    // controls
    document.getElementById('print').addEventListener('click', ()=>{
      if(Object.keys(cart).length===0){ alert('Koszyk jest pusty.'); return; }
      const printWindow = window.open('', '_blank');
      printWindow.document.write(`<pre style="font-family:monospace;white-space:pre-wrap;font-size:14px">${receiptEl.textContent}</pre>`);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    });

    document.getElementById('clear').addEventListener('click', ()=>{ if(confirm('Wyczyścić koszyk?')){ cart={}; renderCart(); }});
    document.getElementById('search').addEventListener('input', (e)=> renderProducts(e.target.value));
    document.getElementById('clearSearch').addEventListener('click', ()=>{ document.getElementById('search').value=''; renderProducts(); });

    // płatność - reszta
    document.getElementById('calculateChange').addEventListener('click', () => {
      const cash = parseFloat(cashEl.value);
      const total = Object.values(cart).reduce((sum, {product, qty}) => sum + product.price * qty * (1 + VAT_RATE), 0);
      if (isNaN(cash) || cash < total) {
        alert('Podana kwota jest za mała!');
        changeEl.textContent = 'Reszta: 0.00 zł';
        return;
      }
      const change = cash - total;
      changeEl.textContent = 'Reszta: ' + change.toFixed(2) + ' zł';
    });

    // initial render
    renderProducts();
    renderCart();
  </script>

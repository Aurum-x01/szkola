<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: bisque;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div{
            display: flex;
            flex-direction: column;
            width: 20%;
            min-width: 200px;
            gap: 5px;
            border: 1px solid black;
            padding: 20px;
            border-radius: 10px;
            background-color: white;
            box-shadow: 5px 5px 10px;
            align-items: center;
        }

        button{
            margin: 2px;
            width: 150px;
            border-radius: 10px;
            transition: transform 0.3s, background-color 0.3s, margin 0.3s;
            background-color: aquamarine;
        }

        button:hover{
            transform: scale(1.1);
            background-color: aqua;
            margin: 6px;
        }

        input{
            padding: 5px;
            border: 1px solid black;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div>
        
        <input type="text" id="input1" placeholder="Wpisz tekst nr1">
        <input type="text" id="input2" placeholder="Wpisz tekst nr2">
        <button onclick="sprawdz()">Sprawdz</button>
    </div>
    <h1></h1>

    <script src="zadanie3.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.15/paper-full.min.js"></script>
    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>  
    <style>

        body{
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: lightseagreen;
        }
        canvas{
            width: 100%;
            height: 100vh;
        }

        #tekst{
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5.9px);
            -webkit-backdrop-filter: blur(5.9px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 20px;
            width: 400px;
            position: absolute;
            text-align: center;
            height: 350px;
            
            
        }
        img{
            border-radius: 20px;
        }



    </style>
 
    <title>Document</title>
  </head>
  <body>
    <div id="tekst">
        
          <h2>Volodymyr Pestrak</h2>
          <h3><span id="text-anim"></span></h3>
          <img src="logo.png" alt="">
        
    </div>
     <canvas id="myCanvas" resize></canvas>
    <script type="text/paperscript" canvas="myCanvas">
      // Only executed our code once the DOM is ready.
      window.onload = function () {
        // Get a reference to the canvas object
        var canvas = document.getElementById("myCanvas");
        // Create an empty project and a view for the canvas:
        paper.setup(canvas);
        // Create a Paper.js Path to draw a line into it:
        var path = new paper.Path();
        // Give the stroke a color
        path.strokeColor = "black";
        var start = new paper.Point(100, 100);
        // Move to start and draw a line from there
        path.moveTo(start);
        // Note that the plus operator on Point objects does not work
        // in JavaScript. Instead, we need to call the add() function:
        path.lineTo(start.add([200, -50]));
        // Draw the view now:
        paper.view.draw();
      };
 
      var mousePoint = view.center;
      var amount = 25;
      var colors = ["blue", "rgb(0, 89, 255)", "rgb(0, 183, 255)", "aqua"];
 
      for (var i = 0; i < amount; i++) {
        var rect = new Rectangle([0, 0], [25, 25]);
        rect.center = mousePoint;
        var path = new Path.Rectangle(rect, 6);
        path.fillColor = colors[i % 4];
        var scale = (1 - i / amount) * 20;
        path.scale(scale);
      }
 
      function onMouseMove(event) {
        mousePoint = event.point;
      }
 
      var children = project.activeLayer.children;
      function onFrame(event) {
        for (var i = 0, l = children.length; i < l; i++) {
          var item = children[i];
          var delta = (mousePoint - item.position) / (i + 5);
          item.rotate(Math.sin((event.count + i) / 10) * 7);
          if (delta.length > 0.1) item.position += delta;
        }
      }
    </script>
 
     <script>
    var typed = new Typed('#text-anim', {
      strings: ['Zespół Szkół nr 1 im. Kazimierza Wielkiego w Mińsku Mazowieckim', ""],
      typeSpeed: 50,
      backSpeed:50,
      smartBackspace: true
    });

  </script>
  </body>
</html>
